global:
  scrape_interval: 15s

scrape_configs:

  - job_name: 'std1'
    scrape_interval: 5s
    static_configs:
      - targets:
          - 192.168.110.181:9100

  - job_name: 'nessus'
    static_configs:
      - targets:
          - 192.168.110.32:9100

  - job_name: 'nifi'
    static_configs:
      - targets:
          - 192.168.110.31:9100

  - job_name: 'repo'
    static_configs:
      - targets:
          - 192.168.110.30:9100

  - job_name: 'redfalcon'
    static_configs:
      - targets:
          - 192.168.110.82:9100

  - job_name: 'ap01'
    static_configs:
      - targets:
          - 192.168.110.20:9182

  - job_name: 'idrac'
    static_configs:
      - targets:
          - '192.168.110.11'
          # Add more iDRAC IPs here if needed

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: idrac_exporter:9348
