grafana-prometheus.yml
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'dc1'
    static_configs:
    - targets:
      - 192.168.110.172:9182
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
    - targets:
      - 192.168.110.191:9100
  - job_name: 'bastion'
    static_configs:
    - targets:
      - 192.168.110.177:9100
  - job_name: 'cobbler8'
    static_configs:
    - targets:
      - 192.168.110.180:9100
  - job_name: 'gitlab'
    static_configs:
    - targets:
      - 192.168.110.173:9100
  - job_name: 'greybox'
    static_configs:
    - targets:
      - 192.168.110.161:9100
  - job_name: 'ipam'
    static_configs:
    - targets:
      - 192.168.110.182:9100
  - job_name: 'jcr'
    static_configs:
    - targets:
      - 192.168.110.194:9100
  - job_name: 'kanban'
    static_configs:
    - targets:
      - 192.168.110.179:9100
  - job_name: 'kvm25'
    static_configs:
    - targets:
      - 192.168.110.160:9100
  - job_name: 'rpmbuild9'
    static_configs:
    - targets:
      - 192.168.110.183:9100
  - job_name: 'wiki'
    static_configs:
    - targets:
      - 192.168.110.189:9100
  - job_name: 'yum'
    static_configs:
    - targets:
      - 192.168.110.190:9100
  - job_name: 'yum10'
    static_configs:
    - targets:
      - 192.168.110.200:9100
  - job_name: 'vmh1'
    static_configs:
    - targets:
      - 192.168.110.168:9182
  - job_name: 'vmh2'
    static_configs:
    - targets:
      - 192.168.110.169:9182
  - job_name: 'idrac'
    static_configs:
      - targets:
        - '192.168.110.222'
        - '192.168.110.11'
        # Add more iDRAC IPs here
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: idrac_exporter:9348
